# ==========================================
# 1. KESCUELITA (Vite - Estático)
# ==========================================
server {
    listen 80;
    server_name kescuelita.kemarketing.mx;
    return 301 https://$host$request_uri; # Forzar HTTPS
}

server {
    listen 443 ssl; 
    server_name kescuelita.kemarketing.mx;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/kemarketing.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kemarketing.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/keEscuela/ArtSchool/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # NUEVO BLOQUE: Redirigir /api al backend (Puerto 3000)
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==========================================
# 2. KESERVICIOS (Vite - Estático)
# ==========================================
server {
    listen 80;
    server_name keservicios.kemarketing.mx;
    return 301 https://$host$request_uri; # Forzar HTTPS
}

server {
    listen 443 ssl;
    server_name keservicios.kemarketing.mx;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/kemarketing.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kemarketing.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/keservicios/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    #Configuración del Backend
    location /api/ {
        # Nginx recibe la petición y se la pasa a tu backend localmente
        proxy_pass http://localhost:8081/api/; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

